[workspace]
resolver = "3"
members = ["crates/core", "crates/index", "crates/rclone", "crates/server"]
# Throwaway measurement tools (docs/design/v2.md, phase 0), each its own Cargo project.
# crates/webdav is parked: it was written for Workers (single-threaded, non-Send futures, a
# per-request CPU budget) and gets ported to the Send storage traits when it gains writes.
exclude = ["spikes", "crates/webdav"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tywrr/chance-of-files"

[workspace.dependencies]
chance-of-files-core = { path = "crates/core" }
chance-of-files-index = { path = "crates/index" }
chance-of-files-rclone = { path = "crates/rclone" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
percent-encoding = "2.3.2"
# Plain HTTP only: the rclone rc API is on loopback, and leaving TLS out keeps OpenSSL and
# aws-lc (C toolchains) out of the static musl build.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
# Only the protocol types: the core keeps its own stateless endpoint (design D1).
rmcp = { version = "3.8.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
# Constant-time comparison of the internal bearer token.
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["time"] }
trait-variant = "0.1.2"

# One static binary per arch; thin LTO keeps cross builds reasonably quick.
[profile.release]
codegen-units = 4
lto = "thin"
strip = true

# SQLite's C code is slow unoptimised, and the index tests walk 150k entries.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

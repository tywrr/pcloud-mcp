[workspace]
resolver = "3"
members = ["crates/core", "crates/webdav", "crates/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tywrr/chance-of-files"

[workspace.dependencies]
chance-of-files-core = { path = "crates/core" }
chance-of-files-webdav = { path = "crates/webdav" }

base64 = "0.23.1"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
# Only the protocol types: rmcp's service runtime needs tokio, which doesn't run on Workers.
rmcp = { version = "3.8.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
worker = "0.8.7"
httpdate = "1.0.3"
# Constant-time comparison of the internal bearer token.
subtle = "2.6.1"
pollster = "0.4.0"
# Native blocking HTTP client for the WebDAV integration tests (plain http to a local rclone).
ureq = { version = "3.5.0", default-features = false }

# Small wasm: one codegen unit + LTO let the optimiser see the whole program, and
# opt-level "s" trades a little speed for size (Workers bills CPU, but startup scales with size).
[profile.release]
codegen-units = 1
lto = true
# Only debug info: worker-build 0.8.7's wasm-bindgen reads the target_features section to
# turn on reference types, and `strip = true` removes it ("externref table required for catch
# wrappers"). The name section that stays (~125 kB) also makes panic stack traces readable.
strip = "debuginfo"
opt-level = "s"

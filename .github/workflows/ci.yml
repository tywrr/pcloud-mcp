# Format, lint and tests for the Rust crates, a release build of the core Worker's wasm, and the
# auth front's typecheck and tests, on every push and pull request. Nothing is deployed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The WebDAV integration test runs the real `rclone serve webdav` on fixtures/webdav-root
      # (it skips itself without rclone). Ubuntu's rclone is years old, so take the pinned release.
      - name: Install rclone
        run: |
          curl -fsSLo "$RUNNER_TEMP/rclone.deb" https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/rclone.deb"
          rclone version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # worker-build takes a few minutes to compile, so keep the binary between runs.
      - uses: actions/cache@v6
        id: worker-build
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}
      - if: steps.worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build@0.8.7 --locked
      # The Worker crate's Workers-only code is compiled only for wasm32, so lint it there too.
      - run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings
      - name: worker-build --release
        working-directory: crates/worker
        run: worker-build --release

  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

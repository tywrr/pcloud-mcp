[package]
name = "pcloud-mcp-webdav"
description = "WebDAV storage backend for pcloud-mcp, generic over the HTTP transport so it runs on Workers and natively"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcloud-mcp-core.workspace = true
base64.workspace = true
httpdate.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
# NFD for accent-insensitive search. The Worker already links it (url's IDNA support uses
# it), so this adds only about 11 kB to the gzipped wasm.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
pollster.workspace = true
serde_json.workspace = true
ureq.workspace = true

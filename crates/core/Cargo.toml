[package]
name = "chance-of-files-core"
description = "MCP (Model Context Protocol) endpoint, file tools, storage traits and path policy for Chance of Files, independent of the storage backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
# NFD for case- and accent-insensitive name matching and path policy.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
# Deadlines on storage calls and index queries on the blocking pool; the caller provides the
# runtime.
tokio = { workspace = true, features = ["rt", "sync"] }
trait-variant.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

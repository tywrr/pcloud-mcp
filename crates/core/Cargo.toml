[package]
name = "chance-of-files-core"
description = "MCP (Model Context Protocol) server logic and file tools for Chance of Files, independent of the storage backend and runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
# NFD for accent-insensitive search. The Worker already links it (url's IDNA support uses
# it), so this adds only about 11 kB to the gzipped wasm.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pollster = "0.4.0"

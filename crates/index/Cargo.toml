[package]
name = "chance-of-files-index"
description = "The Chance of Files metadata index: SQLite, split walks with removal guards, audit queries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chance-of-files-core.workspace = true
base64.workspace = true
futures-util.workspace = true
# Bundled: one SQLite version everywhere, including the static musl build.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

# The core's data volume, mounted at /var/lib/chance-of-files. 0.3 keeps the index here
# (index/index.db, ~90 MB for 139k entries); the mirror and link staging of later releases live
# here too, which is why it is sized well beyond what 0.3 uses. The default StorageClass provisions it; an overlay can bind
# it to a pre-made PersistentVolume instead (volumeName + storageClassName).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chance-of-files-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 50Gi }

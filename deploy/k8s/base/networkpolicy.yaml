# Nothing connects to this pod: cloudflared dials out, and the core and rclone listen on loopback.
# Egress is what the pod needs and nothing else: DNS, HTTPS (pCloud's API and downloads,
# cloudflared's edge discovery) and 7844 (the tunnel itself, QUIC over UDP or the TCP fallback).
# On a cluster without a NetworkPolicy controller this is inert, which is harmless.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chance-of-files
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 7844 }
        - { protocol: UDP, port: 7844 }
